# Browser version of the apps (Voici): published to GitHub Pages and, for
# download, attached to the run as bernina-apps.zip (site + launchers).
# Needs Settings > Pages > Source: "GitHub Actions" in the repository; until
# that is set it only runs when started by hand (Actions > browser version).
name: browser version

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: lite/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lite/_output/site
      - uses: actions/upload-artifact@v4
        with:
          name: bernina-apps
          path: lite/_output/bernina-apps.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
