[workspace]
name = "bernina-scripts-dev"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Mirrors environment.yml (the Binder-facing spec) as closely as possible,
# so `pixi run voila` here is a fast, local stand-in for a Binder launch --
# no multi-minute Docker rebuild per iteration.

[dependencies]
python = "3.12.*"
ipykernel = "*"  # not needed on Binder (repo2docker's base image already has it); needed for local pixi
numpy = "*"
scipy = "*"
matplotlib = "*"
ipython = "*"
ipympl = "*"
ipywidgets = ">=8"
pandas = "*"
pip = "*"
xrayutilities = "*"
voila = "<0.5.8"

[pypi-dependencies]
diffcalc_core = "*"
bernina_prep = { path = ".", editable = true }

[tasks]
voila = "voila apps"
